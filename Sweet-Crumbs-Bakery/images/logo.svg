<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88B97"/>
      <stop offset="100%" stop-color="#C65D6D"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B07D"/>
      <stop offset="100%" stop-color="#BF7836"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(6, 6)">
    <!-- Outer delicate ring -->
    <circle cx="24" cy="24" r="23" stroke="#E88B97" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="24" cy="24" r="20" fill="#FFF5F5"/>
    
    <!-- Stylized Cake / Cupcake Emblem -->
    <!-- Berry -->
    <circle cx="24" cy="15" r="3.2" fill="#C65D6D"/>
    <!-- Frosting curves -->
    <path d="M16 26 C13 22, 17 18, 24 18 C31 18, 35 22, 32 26 C30 28, 18 28, 16 26 Z" fill="url(#logoPink)"/>
    <!-- Liner -->
    <path d="M17 27 L19 36 C19.2 37, 20.2 37.5, 21.5 37.5 L26.5 37.5 C27.8 37.5, 28.8 37, 29 36 L31 27 Z" fill="url(#logoGold)"/>
    <line x1="20.5" y1="28" x2="22.5" y2="37" stroke="#874E20" stroke-width="0.8" opacity="0.6"/>
    <line x1="24" y1="28" x2="24" y2="37" stroke="#874E20" stroke-width="0.8" opacity="0.6"/>
    <line x1="27.5" y1="28" x2="25.5" y2="37" stroke="#874E20" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="64" y="29" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2E221F" letter-spacing="0.5">Sweet Crumbs</text>
  <text x="65" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#C65D6D" letter-spacing="3.5">ARTISANAL BAKERY</text>
</svg>
