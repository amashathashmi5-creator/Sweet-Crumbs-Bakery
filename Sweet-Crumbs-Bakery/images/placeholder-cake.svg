<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F2"/>
      <stop offset="50%" stop-color="#FCE7EB"/>
      <stop offset="100%" stop-color="#F7D6DC"/>
    </linearGradient>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FCE7EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgPastel)"/>
  <circle cx="300" cy="225" r="160" fill="url(#cakeGlow)"/>
  
  <!-- Cake Illustration -->
  <g transform="translate(180, 110)">
    <!-- Stand -->
    <ellipse cx="120" cy="230" rx="90" ry="14" fill="#E8B07D" opacity="0.4"/>
    <path d="M110 210 L110 230 L130 230 L130 210 Z" fill="#D49A6A"/>
    <ellipse cx="120" cy="210" rx="100" ry="12" fill="#F3E5D8"/>
    
    <!-- Bottom Tier -->
    <path d="M50 140 C50 140, 50 190, 50 190 C50 205, 190 205, 190 190 L190 140 Z" fill="#FFFFFF"/>
    <ellipse cx="120" cy="140" rx="70" ry="14" fill="#FCE7EB"/>
    <!-- Bottom tier drips -->
    <path d="M50 150 Q60 170, 70 150 Q80 175, 90 150 Q110 180, 130 150 Q150 175, 170 150 Q180 168, 190 150" fill="none" stroke="#E88B97" stroke-width="4" stroke-linecap="round"/>

    <!-- Top Tier -->
    <path d="M75 90 C75 90, 75 130, 75 130 C75 142, 165 142, 165 130 L165 90 Z" fill="#FFFFFF"/>
    <ellipse cx="120" cy="90" rx="45" ry="10" fill="#FCE7EB"/>

    <!-- Floral / Berry Crown -->
    <circle cx="120" cy="78" r="8" fill="#C65D6D"/>
    <circle cx="108" cy="83" r="6" fill="#E88B97"/>
    <circle cx="132" cy="83" r="6" fill="#E88B97"/>
    <circle cx="98" cy="88" r="4.5" fill="#D49A6A"/>
    <circle cx="142" cy="88" r="4.5" fill="#D49A6A"/>
  </g>
  
  <text x="300" y="380" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#6E5D57" text-anchor="middle">Sweet Crumbs Artisanal Bakery</text>
  <text x="300" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A8948D" text-anchor="middle">Freshly Baked Daily</text>
</svg>
