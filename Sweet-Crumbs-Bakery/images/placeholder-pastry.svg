<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="50%" stop-color="#FDF3E7"/>
      <stop offset="100%" stop-color="#FCECE2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgWarm)"/>
  
  <!-- Croissant Illustration -->
  <g transform="translate(190, 130)">
    <!-- Shadow -->
    <ellipse cx="110" cy="180" rx="90" ry="12" fill="#D49A6A" opacity="0.25"/>
    <!-- Crescent body -->
    <path d="M20 150 C30 90, 80 50, 110 50 C140 50, 190 90, 200 150 C160 170, 60 170, 20 150 Z" fill="#D49A6A"/>
    <path d="M40 140 C50 95, 85 65, 110 65 C135 65, 170 95, 180 140 C145 155, 75 155, 40 140 Z" fill="#E8B07D"/>
    <!-- Central roll -->
    <path d="M70 120 C80 85, 100 75, 110 75 C120 75, 140 85, 150 120 C130 135, 90 135, 70 120 Z" fill="#F3D3B1"/>
    <!-- Glaze sheen -->
    <path d="M60 100 Q110 80, 160 100" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  
  <text x="300" y="370" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="#6E5D57" text-anchor="middle">Artisanal Viennoiserie</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A8948D" text-anchor="middle">100% Pure Butter Flaky Pastry</text>
</svg>
